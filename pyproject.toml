[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-teams-interaction"
version = "0.1.0"
description = "Browser-only Teams (M365) automation: watch channels and send plain text without Azure app registration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ms-teams-interaction contributors" }]
dependencies = [
    "playwright>=1.40.0",
]

[project.optional-dependencies]
cli = ["typer>=0.9.0", "rich>=13.0.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]
lint = ["ruff>=0.9.0", "pre-commit>=4.0"]

[project.scripts]
teams-interaction = "teams_interaction.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
